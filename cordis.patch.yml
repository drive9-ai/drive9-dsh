# Replace the base filesystem and spill backend while retaining DSH's stock
# filesystem tools, observation policy, subprocess runtime, and spill policy.

- id: fs-sandbox
  disabled: true

- id: spill-local
  disabled: true

- insert:
    - id: drive9-filesystem
      name: '@drive9/drive9-dsh/filesystem'
      config:
        mountRoot: !!js process.env.DRIVE9_MOUNT_ROOT ?? '/mnt/drive9'
        remoteRoot: !!js process.env.DRIVE9_REMOTE_ROOT ?? '/'
        baseUrl: !!js process.env.DRIVE9_BASE_URL
        apiKey: !!js process.env.DRIVE9_WORKSPACE_API_KEY
        mountConsistency: !!js process.env.DRIVE9_MOUNT_CONSISTENCY ?? 'strong'

    - id: drive9-evidence
      name: '@drive9/drive9-dsh/evidence'
      config:
        root: !!js process.env.DRIVE9_EVIDENCE_ROOT ?? '/evidence/dsh'
        baseUrl: !!js process.env.DRIVE9_EVIDENCE_BASE_URL ?? process.env.DRIVE9_BASE_URL
        apiKey: !!js process.env.DRIVE9_EVIDENCE_API_KEY
        workspaceApiKey: !!js process.env.DRIVE9_WORKSPACE_API_KEY

    - id: drive9-result-tools
      name: '@drive9/drive9-dsh/result-tools'

    - id: drive9-runtime-context
      name: '@drive9/drive9-dsh/runtime-context'
      config:
        mountConsistency: !!js process.env.DRIVE9_MOUNT_CONSISTENCY ?? 'strong'
